<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>

</head>

<body>
    <div class="package">
        <h2>Student Mangement System</h2>
        <div class="box">

            <form action="">
                <div class="info">
                    <input type="text" id="in1" placeholder="Enter Your Name">
                    <input type="number" id="in2" placeholder="Enter Your Age">
                    <input type="text" id="in3" placeholder="Enter Your Course">
                </div>
                <div class="submit">
                    <input type="text" id="search" placeholder="Search By Name">
                    <button id="btn1">Save Data</button>
                </div>
            </form>
        </div>
    </div>

    <div class="package1" id="searchData">

    </div>


    <div class="package">
        <div class="box">
            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Course</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tbody">

                </tbody>
            </table>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
